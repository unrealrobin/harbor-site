[build]
  command = "npm run build"
  publish = "dist"

# astro 7.4 requires Node >= 22.22.0. Pin the major the site is built and
# verified on locally rather than trusting Netlify's default image.
[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Docs (CLI-oriented) were removed in HAR-180. 301 old doc URLs to the homepage
# so inbound links and search results don't dead-end. Reintroduce when the
# web-configurator docs land.
[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/"
  status = 301
